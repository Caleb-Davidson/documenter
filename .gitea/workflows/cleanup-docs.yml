# Thin caller: when a PR closes, delegate preview teardown to the central reusable
# workflow. Triggers only on pull_request closed, so it never appears as a check on
# an open PR.

name: docs
on:
  pull_request:
    types: [closed]

concurrency:
  group: docs-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    uses: mathroze/workflows/.gitea/workflows/docs.yml@v1
    with:
      phase: cleanup
    secrets: inherit
