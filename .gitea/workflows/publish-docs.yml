# Reusable docs publishing workflow for the internal docs-server.
#
# Drop this into any repo as `.gitea/workflows/publish-docs.yml`. It serves the
# repo's documenter `docs/` shell from the shared docs-server:
#
#   * PROD — push to main (docs/** changed)   -> :8088/<repo>/
#   * DEV  — EVERY PR gets one sticky comment with the docs link(s). If the PR
#            changes docs/**, a per-PR PREVIEW is also published and linked:
#                                               -> :8088/pr/<repo>/<PR#>/
#            PRs that don't touch docs/ just get the prod (main) link, no preview.
#
# The sticky comment is updated in place (never spammed) and marked torn down when
# the PR closes. Prod and preview live in sibling trees under the docs-server
# `sites/` root, so republishing one never clobbers the other:
#
#   sites/<repo>/            <- prod
#   sites/pr/<repo>/<PR#>/   <- per-PR preview   (a repo literally named "pr" would
#                                                  collide; none do)
#
# "Did this PR change docs/?" is detected in-job via `git diff origin/<base>...HEAD`
# (needs checkout fetch-depth: 0), which is why the pull_request trigger has NO top
# level paths filter — the job runs on every PR and decides for itself.
#
# How the copy works: the job runs in the ci-node container, which has the host
# Docker socket. It tars `docs/` over stdin into a throwaway `alpine` container that
# bind-mounts the docs-server `sites` volume FROM THE HOST and unpacks it. No
# gitea-runner config change and no host path mounted into the job container.
#
# The PR comment uses the INTERNAL http://gitea.example.com/api/v1 — the instance ROOT_URL
# (http://ci-host) is not reliably resolvable from a job container (same
# trap as the PR #5 checkout fix). The auto-injected ${{ secrets.GITEA_TOKEN }}
# already has PR-comment write for same-repo PRs. The comment body is built inside
# Node (from env vars) so there is no fragile multi-line shell string in the YAML.
#
# Requirements on the box (already set up): the docs-server stack, site root at
# host path /srv/sites . See an internal doc and
# an internal runbook in the internal KB.

name: Publish docs
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch: {}

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOCS_BASE: http://docs.example.com
  SITES: /srv/sites

jobs:
  # --- PROD: publish docs/ to sites/<repo>/ on merge to main -----------------
  prod:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish prod docs
        run: |
          set -euo pipefail
          REPO="${{ github.event.repository.name }}"
          if [ ! -d docs ]; then echo "No docs/ — nothing to publish."; exit 0; fi
          echo "Publishing prod docs for '$REPO'..."
          tar -C docs -cf - . | docker run --rm -i -v "$SITES":/out \
            alpine:3 sh -c "rm -rf \"/out/$REPO\" && mkdir -p \"/out/$REPO\" && tar -C \"/out/$REPO\" -xf -"
          echo "Done: $DOCS_BASE/$REPO/"

  # --- DEV: on every PR, publish a preview if docs/ changed, then upsert a sticky comment ---
  preview:
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish PR preview docs when docs/ changed
        run: |
          set -euo pipefail
          REPO="${{ github.event.repository.name }}"
          PR="${{ github.event.pull_request.number }}"
          BASE="${{ github.base_ref }}"
          git fetch -q origin "$BASE" 2>/dev/null || true
          if git rev-parse -q --verify "origin/$BASE" >/dev/null 2>&1; then
            CHANGED="$(git diff --name-only "origin/$BASE...HEAD" -- docs 2>/dev/null || true)"
          else
            CHANGED="$(git diff --name-only HEAD~1 HEAD -- docs 2>/dev/null || true)"
          fi
          if [ -n "$CHANGED" ] && [ -d docs ]; then
            echo "HAS_DOCS=1" >> "$GITHUB_ENV"
            echo "docs/ changed — publishing preview for '$REPO' PR #$PR..."
            tar -C docs -cf - . | docker run --rm -i -v "$SITES":/out \
              alpine:3 sh -c "rm -rf \"/out/pr/$REPO/$PR\" && mkdir -p \"/out/pr/$REPO/$PR\" && tar -C \"/out/pr/$REPO/$PR\" -xf -"
            echo "Done: $DOCS_BASE/pr/$REPO/$PR/"
          else
            echo "HAS_DOCS=0" >> "$GITHUB_ENV"
            echo "No docs/ changes in this PR — will post the prod link only."
          fi
      - name: Upsert sticky PR comment
        env:
          GITEA_API: http://gitea.example.com/api/v1
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const e = process.env;
          const [owner, repo] = e.REPO_FULL.split('/');
          const pr = e.PR, marker = '<!-- docs-preview -->';
          const hasDocs = e.HAS_DOCS === '1';
          const body = hasDocs
            ? `${marker}\n**Docs preview**\n\n- This PR (#${pr}): ${e.DOCS_BASE}/pr/${e.REPO}/${pr}/\n- main: ${e.DOCS_BASE}/${e.REPO}/\n\n<sub>Updated for \`${e.SHA}\`.</sub>`
            : `${marker}\n**Docs**\n\n- main: ${e.DOCS_BASE}/${e.REPO}/\n\n<sub>No docs changes in this PR. Updated for \`${e.SHA}\`.</sub>`;
          const h = { Authorization: `token ${e.TOKEN}`, 'Content-Type': 'application/json' };
          const base = `${e.GITEA_API}/repos/${owner}/${repo}`;
          (async () => {
            const list = await fetch(`${base}/issues/${pr}/comments`, { headers: h }).then(r => r.json());
            const mine = Array.isArray(list) ? list.find(c => c.body && c.body.includes(marker)) : null;
            const res = mine
              ? await fetch(`${base}/issues/comments/${mine.id}`, { method: 'PATCH', headers: h, body: JSON.stringify({ body }) })
              : await fetch(`${base}/issues/${pr}/comments`, { method: 'POST', headers: h, body: JSON.stringify({ body }) });
            console.log(`${mine ? 'patched' : 'posted'} comment -> ${res.status}`);
            if (!res.ok) { console.error(await res.text()); process.exit(1); }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

  # --- CLEANUP: remove the preview + mark the comment when the PR closes ------
  cleanup:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove PR preview
        run: |
          set -euo pipefail
          REPO="${{ github.event.repository.name }}"
          PR="${{ github.event.pull_request.number }}"
          docker run --rm -v "$SITES":/out alpine:3 sh -c \
            "rm -rf \"/out/pr/$REPO/$PR\"; rmdir --ignore-fail-on-non-empty \"/out/pr/$REPO\" 2>/dev/null || true"
          echo "Removed preview for '$REPO' PR #$PR."
      - name: Mark comment torn down
        env:
          GITEA_API: http://gitea.example.com/api/v1
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          node - <<'NODE'
          const e = process.env;
          const [owner, repo] = e.REPO_FULL.split('/');
          const pr = e.PR, marker = '<!-- docs-preview -->';
          const body = `${marker}\n**Docs preview** — torn down (PR closed).\n\n- main: ${e.DOCS_BASE}/${e.REPO}/`;
          const h = { Authorization: `token ${e.TOKEN}`, 'Content-Type': 'application/json' };
          const base = `${e.GITEA_API}/repos/${owner}/${repo}`;
          (async () => {
            const list = await fetch(`${base}/issues/${pr}/comments`, { headers: h }).then(r => r.json());
            const mine = Array.isArray(list) ? list.find(c => c.body && c.body.includes(marker)) : null;
            if (!mine) { console.log('no sticky comment to update'); return; }
            const res = await fetch(`${base}/issues/comments/${mine.id}`, { method: 'PATCH', headers: h, body: JSON.stringify({ body }) });
            console.log(`patched teardown -> ${res.status}`);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
