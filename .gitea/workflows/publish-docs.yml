# Thin caller: on merge to main, delegate docs publishing to the central reusable
# workflow. Triggers only on push to main, so it never appears as a PR check.

name: docs
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch: {}

concurrency:
  group: docs-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod:
    uses: mathroze/workflows/.gitea/workflows/docs.yml@v1
    with:
      phase: prod
    secrets: inherit
