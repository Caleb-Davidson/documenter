name: Publish docs

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ["docs/**"]
  workflow_dispatch: {}

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOCS_BASE: http://docs.example.com
  SITES: /srv/sites

jobs:
  prod:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish prod docs
        run: |
          set -euo pipefail
          REPO="${{ github.event.repository.name }}"
          if [ ! -d docs ]; then echo "No docs/ — nothing to publish."; exit 0; fi
          echo "Publishing prod docs for '$REPO'..."
          tar -C docs -cf - . | docker run --rm -i -v "$SITES":/out \
            alpine:3 sh -c "rm -rf \"/out/$REPO\" && mkdir -p \"/out/$REPO\" && tar -C \"/out/$REPO\" -xf -"
          echo "Done: $DOCS_BASE/$REPO/"

  preview:
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish PR preview docs
        run: |
          set -euo pipefail
          REPO="${{ github.event.repository.name }}"
          PR="${{ github.event.pull_request.number }}"
          if [ ! -d docs ]; then echo "No docs/ — nothing to preview."; exit 0; fi
          echo "Publishing preview for '$REPO' PR #$PR..."
          tar -C docs -cf - . | docker run --rm -i -v "$SITES":/out \
            alpine:3 sh -c "rm -rf \"/out/pr/$REPO/$PR\" && mkdir -p \"/out/pr/$REPO/$PR\" && tar -C \"/out/pr/$REPO/$PR\" -xf -"
          echo "Done: $DOCS_BASE/pr/$REPO/$PR/"
      - name: Upsert sticky PR comment
        env:
          GITEA_API: http://gitea.example.com/api/v1
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          STATE: live
        run: |
          node - <<'NODE'
          const e = process.env;
          const [owner, repo] = e.REPO_FULL.split('/');
          const pr = e.PR, marker = '<!-- docs-preview -->';
          const body = e.STATE === 'live'
            ? `${marker}\n**Docs preview**\n\n- This PR (#${pr}): ${e.DOCS_BASE}/pr/${e.REPO}/${pr}/\n- Prod (main): ${e.DOCS_BASE}/${e.REPO}/\n\n<sub>Updated for \`${e.SHA}\`.</sub>`
            : `${marker}\n**Docs preview** — torn down (PR closed).\n\n- Prod (main): ${e.DOCS_BASE}/${e.REPO}/`;
          const h = { Authorization: `token ${e.TOKEN}`, 'Content-Type': 'application/json' };
          const base = `${e.GITEA_API}/repos/${owner}/${repo}`;
          (async () => {
            const list = await fetch(`${base}/issues/${pr}/comments`, { headers: h }).then(r => r.json());
            const mine = Array.isArray(list) ? list.find(c => c.body && c.body.includes(marker)) : null;
            if (e.STATE !== 'live' && !mine) { console.log('no sticky comment to update'); return; }
            const res = mine
              ? await fetch(`${base}/issues/comments/${mine.id}`, { method: 'PATCH', headers: h, body: JSON.stringify({ body }) })
              : await fetch(`${base}/issues/${pr}/comments`, { method: 'POST', headers: h, body: JSON.stringify({ body }) });
            console.log(`${mine ? 'patched' : 'posted'} comment -> ${res.status}`);
            if (!res.ok) { console.error(await res.text()); process.exit(1); }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

  cleanup:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove PR preview
        run: |
          set -euo pipefail
          REPO="${{ github.event.repository.name }}"
          PR="${{ github.event.pull_request.number }}"
          docker run --rm -v "$SITES":/out alpine:3 sh -c \
            "rm -rf \"/out/pr/$REPO/$PR\"; rmdir --ignore-fail-on-non-empty \"/out/pr/$REPO\" 2>/dev/null || true"
          echo "Removed preview for '$REPO' PR #$PR."
      - name: Mark comment torn down
        env:
          GITEA_API: http://gitea.example.com/api/v1
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          STATE: closed
        run: |
          node - <<'NODE'
          const e = process.env;
          const [owner, repo] = e.REPO_FULL.split('/');
          const pr = e.PR, marker = '<!-- docs-preview -->';
          const body = e.STATE === 'live'
            ? `${marker}\n**Docs preview**\n\n- This PR (#${pr}): ${e.DOCS_BASE}/pr/${e.REPO}/${pr}/\n- Prod (main): ${e.DOCS_BASE}/${e.REPO}/\n\n<sub>Updated for \`${e.SHA}\`.</sub>`
            : `${marker}\n**Docs preview** — torn down (PR closed).\n\n- Prod (main): ${e.DOCS_BASE}/${e.REPO}/`;
          const h = { Authorization: `token ${e.TOKEN}`, 'Content-Type': 'application/json' };
          const base = `${e.GITEA_API}/repos/${owner}/${repo}`;
          (async () => {
            const list = await fetch(`${base}/issues/${pr}/comments`, { headers: h }).then(r => r.json());
            const mine = Array.isArray(list) ? list.find(c => c.body && c.body.includes(marker)) : null;
            if (!mine) { console.log('no sticky comment to update'); return; }
            const res = await fetch(`${base}/issues/comments/${mine.id}`, { method: 'PATCH', headers: h, body: JSON.stringify({ body }) });
            console.log(`patched teardown -> ${res.status}`);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
