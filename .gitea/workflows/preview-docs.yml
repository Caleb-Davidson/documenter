# Thin caller: on an open PR, delegate the docs preview to the central reusable
# workflow. Triggers only on pull_request open/sync/reopen, so only this check
# shows on an open PR (publish and cleanup stay off the list). The docs-server
# host and paths live in mathroze/workflows, not here.

name: docs
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: docs-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    uses: mathroze/workflows/.gitea/workflows/docs.yml@v1
    with:
      phase: preview
    secrets: inherit
