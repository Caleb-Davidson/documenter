<svg xmlns="http://www.w3.org/2000/svg" width="546" height="70" viewBox="0 0 546 70" role="img" aria-labelledby="pipeline-title">
  <title id="pipeline-title">Markdown to docs shell to rendered page</title>
  <style>
    .node       { fill: #ffffff; stroke: #d8ddea; stroke-width: 1; }
    .node-label { fill: #1f2937; font: 400 16px Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .edge       { stroke: #2563eb; stroke-width: 1; fill: none; }
    .edge-arrow { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .node       { fill: #303b43; stroke: #5d6f7d; }
      .node-label { fill: #eeeeee; }
      .edge       { stroke: #31c4ca; }
      .edge-arrow { fill: #31c4ca; }
    }
  </style>
  <defs>
    <marker id="pipeline-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8"
            refX="5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path class="edge-arrow" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
  <rect class="node" x="8" y="8" width="126" height="54" rx="4" />
  <text class="node-label" x="71" y="40" text-anchor="middle">Markdown</text>
  <rect class="node" x="184" y="8" width="140" height="54" rx="4" />
  <text class="node-label" x="254" y="40" text-anchor="middle">Docs Shell</text>
  <rect class="node" x="374" y="8" width="164" height="54" rx="4" />
  <text class="node-label" x="456" y="40" text-anchor="middle">Rendered Page</text>
  <path class="edge" marker-end="url(#pipeline-arrow)" d="M134 35 L182 35" />
  <path class="edge" marker-end="url(#pipeline-arrow)" d="M324 35 L372 35" />
</svg>
